name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure, Build, and Test
        run: |
          # Verify CMakeLists.txt is present before invoking CMake
          if [ ! -f "CMakeLists.txt" ]; then
            echo "::warning ::CMakeLists.txt is not yet present. Skipping build and test execution until Milestone 1 CMake skeleton is committed."
            exit 0
          fi

          echo "Configuring project with C++17 and CMake..."
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

          echo "Building targets..."
          cmake --build build

          echo "Executing test suite..."
          ctest --test-dir build --output-on-failure
